server:
  port: 8080

spring:
  application:
    name: lost-and-found_backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sagasu}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true

app:
  jwt:
    secret: ${JWT_SECRET:sagasu-lost-and-found-super-secret-key-that-is-at-least-256-bits-long-2026}
    expiration-ms: 86400000 # 24 hours

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
